<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F1E4" />
    <script>
      (function () {
        try {
          var escolha = localStorage.getItem('xingxing-tema')
          var escuro = window.matchMedia('(prefers-color-scheme: dark)').matches
          var tema = escolha === 'dia' || escolha === 'noite' ? escolha : escuro ? 'noite' : 'dia'
          document.documentElement.setAttribute('data-tema', tema)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', tema === 'noite' ? '#171D14' : '#F3F1E4')
        } catch (e) {}
      })()
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Xingxing" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Xingxing</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
